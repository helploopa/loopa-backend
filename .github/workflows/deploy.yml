name: Deploy to Vercel

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Type-check · Lint · Build · Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Prisma generate
        run: npx prisma generate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: TypeScript type check
        run: npx tsc --noEmit

      - name: Lint
        run: npx eslint src --ext .ts

      - name: Build
        run: npm run build

      - name: Deploy to Vercel (production)
        run: npx vercel --prod --yes --token="vcp_8iTLsk8oOXJcRVsXw06JFG1XDFAObNJOs80bsO16htBIWb1JA12R60qf"
        env:
          VERCEL_ORG_ID: "team_uVUhFLc3WrTnH7lj1yOhXY2I"
          VERCEL_PROJECT_ID: "prj_n0uWkX4dpAgRaGstketzLtqdS7jH"
